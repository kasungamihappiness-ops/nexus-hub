version: '3.8'

services:
  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_ENV=development
    depends_on:
      - backend
    networks:
      - nexus-network

  backend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ../../backend:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://nexus:nexus123@postgres:5432/nexus_hub
    depends_on:
      - postgres
    command: npm run dev
    networks:
      - nexus-network

  postgres:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus123
      - POSTGRES_DB=nexus_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus-network

volumes:
  postgres_data:

networks:
  nexus-network:
    driver: bridge
